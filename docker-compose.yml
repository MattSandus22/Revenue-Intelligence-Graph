services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: rig_test
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://rig_app:rig_app@postgres:5432/rig_test
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/rig_test
      RIG_DEV_LOGIN: "1"      # demo/dev only — remove for production (OIDC)
      RIG_DEMO_SEED: "1"      # seeds the Acme walkthrough tenant on first boot
    ports:
      - "8000:8000"

volumes:
  pgdata:
