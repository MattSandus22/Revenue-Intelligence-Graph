[project]
name = "rig-backend"
version = "0.1.0"
description = "Revenue Intelligence Graph — backend (Sprint 1 platform foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "anthropic>=1.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only `rig` (and its subpackages) is an installable package. Without this,
# setuptools flat-layout auto-discovery finds sibling dirs `evals/` and
# `migrations/` and refuses to build ("Multiple top-level packages
# discovered"). YAML signal definitions ship as package data.
[tool.setuptools.packages.find]
include = ["rig*"]

[tool.setuptools.package-data]
rig = ["signals/definitions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
